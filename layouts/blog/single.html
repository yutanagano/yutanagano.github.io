{{ define "main" }}
<article class="blog-post">
	{{ with .Parent }}
	<nav class="blog-post-nav" aria-label="Blog">
		<p class="blog-back"><a href="{{ .Permalink }}">← Blog</a></p>
	</nav>
	{{ end }}
	<header class="blog-post-header">
		<h1>{{ partial "title-with-accent.html" .Title }}</h1>
		<p class="blog-meta">{{ .Date.Format "January 2, 2006" }}</p>
	</header>
	<div class="blog-post-content">
		{{ .Content }}
	</div>
	{{ with .Parent }}
	<nav class="blog-post-nav blog-post-nav--end" aria-label="Blog">
		<p class="blog-back"><a href="{{ .Permalink }}">← Blog</a></p>
	</nav>
	{{ end }}
</article>
{{ end }}
