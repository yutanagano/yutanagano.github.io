{{ define "main" }}
<article>
	{{ with .Parent }}
	<nav aria-label="Blog">
		<p class="blog-back"><a href="{{ .Permalink }}">← Blog</a></p>
	</nav>
	{{ end }}
	<header>
		<h1>{{ partial "title-with-accent.html" .Title }}</h1>
		<p class="blog-meta">{{ .Date.Format "January 2, 2006" }}</p>
	</header>
	{{ .Content }}
	{{ with .Parent }}
	<nav class="blog-post-nav--end" aria-label="Blog">
		<p class="blog-back"><a href="{{ .Permalink }}">← Blog</a></p>
	</nav>
	{{ end }}
</article>
{{ end }}
