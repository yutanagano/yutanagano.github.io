<!DOCTYPE html>
<html lang="en">
  <head>
    {{ partial "meta.html" . }}
    {{ $noop := .WordCount }}
    {{ if .Page.Store.Get "hasMath" }}
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css"
      integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB"
      crossorigin="anonymous"
    />
    {{ end }}
  </head>
  <body>
    <header>
      {{ partial "nav.html" }}
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      © Yuta Nagano
    </footer>
  </body>
</html>
