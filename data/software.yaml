# Valid types of links are:
# - github
# - pypi
# - crates
# - docs
# - home
# - npm

projects:
  - name: sceptr
    role: "author, maintainer"
    description: >
      A small and fast TCR langauge model that produces highly informative TCR
      embeddings for accurate downstream TCR specificity prediction and
      clustering.
    links:
      - type: github
        url: https://github.com/yutanagano/sceptr
      - type: docs
        url: https://sceptr.readthedocs.io
      - type: pypi
        url: https://pypi.org/project/sceptr
    stage: production
    language: Python
    weight: 1

  - name: tidytcells
    role: "author, maintainer"
    description: >
      A lightweight Python package that cleans and standardizes T cell receptor
      (TR), Major Histocompatibility (MH), and Immunoglobulin (IG) data to be
      IMGT-compliant.
    links:
      - type: github
        url: https://github.com/yutanagano/tidytcells
      - type: docs
        url: https://tidytcells.readthedocs.io
      - type: pypi
        url: https://pypi.org/project/tidytcells
    stage: production
    language: Python
    weight: 2

  - name: symscan
    role: "author, maintainer"
    description: >
      A tool for fast discovery of similar strings in bulk, available as a CLI
      and library, with Python bindings.
    links:
      - type: github
        url: https://github.com/yutanagano/nearust
      - type: docs
        url: https://symscan.readthedocs.io
      - type: pypi
        url: https://pypi.org/project/symscan
      - type: crates
        url: https://crates.io/crates/symscan
    stage: production
    language: Rust
    weight: 3

  - name: smark.nvim
    role: "author, maintainer"
    description: >
      A smart, Prettier-compatible Markdown auto-bullet list plugin for NeoVim.
    links:
      - type: github
        url: https://github.com/yutanagano/smark.nvim
    stage: production
    language: Lua
    weight: 4

  - name: pyrepseq
    role: contributor
    description: >
      A Python library that provides algorithms and visualization tools to speed
      up the analysis of immune repertoire sequencing data.
    links:
      - type: github
        url: https://github.com/andim/pyrepseq
      - type: docs
        url: https://pyrepseq.readthedocs.io
      - type: pypi
        url: https://pypi.org/project/pyrepseq/
    stage: production
    language: Python
    weight: 5
